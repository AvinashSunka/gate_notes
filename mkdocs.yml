site_name: My Docs

theme:
  name: material
  palette:
    - scheme: default     # Light mode
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate       # Dark mode
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list

nav :
  - Home : index.md
  - DBMS :
      - Syllabus: dbms/Syllabus.md 
      - Additional resources: dbms/1.Additional_information.md
